services:
  - type: web
    name: telegram-group-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    
    # Render pe disk persist karo database ke liye
    disk:
      name: bot-data
      mountPath: /data
      sizeGB: 1

    envVars:
      # ─── REQUIRED ───────────────────────────────────────────────────────────
      - key: BOT_TOKEN
        sync: false

      # ─── AI PROVIDERS ───────────────────────────────────────────────────────
      - key: GROQ_API_KEY
        sync: false          # groq.com/keys se free mein milega

      - key: GROQ_MODEL
        value: "llama-3.3-70b-versatile"

      - key: ANTHROPIC_API_KEY
        sync: false          # Optional fallback

      # ─── OPTIONAL ───────────────────────────────────────────────────────────
      - key: OWNER_ID
        sync: false

      - key: LOG_CHANNEL_ID
        sync: false

      - key: DATABASE_PATH
        value: /data/bot_data.db

      - key: MAX_WARNINGS
        value: "3"

      - key: FLOOD_LIMIT
        value: "5"

      - key: FLOOD_WINDOW
        value: "5"

      - key: AI_MODEL
        value: "claude-opus-4-5"

      - key: PORT
        value: "8080"
